---
- name: Build a host and vulnerability report from Red Hat Lightspeed
  hosts: localhost
  gather_facts: false
  vars:
    # Change these to suit your environment.
    lightspeed_report_title: Server vulnerability report
    lightspeed_report_hosts: "{{ groups['all'] | reject('equalto', 'localhost') | list }}"
    # Where to save the HTML file. localhost keeps it inside the job's
    # container, so set an inventory host with a web server for real use.
    lightspeed_report_host: localhost
    lightspeed_report_dest: /tmp/lightspeed_report.html
    # Lightspeed endpoints and limits; normally left alone.
    lightspeed_report_sso_url: https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    lightspeed_report_api: https://console.redhat.com/api/vulnerability/v1
    lightspeed_report_timeout: 90
    lightspeed_report_client_id: "{{ lookup('ansible.builtin.env', 'INSIGHTS_CLIENT_ID') }}"
    lightspeed_report_client_secret: "{{ lookup('ansible.builtin.env', 'INSIGHTS_CLIENT_SECRET') }}"
    # One count per host for each of these CVE filters.
    lightspeed_report_buckets:
      - { name: critical, query: 'impact=7' }
      - { name: important, query: 'impact=5' }
      - { name: known_exploit, query: 'known_exploit=true' }
      - { name: fixable, query: 'advisory_available=true' }

  tasks:
    - name: Check the inputs before calling Lightspeed
      ansible.builtin.assert:
        that:
          - lightspeed_report_client_id | length > 0
          - lightspeed_report_client_secret | length > 0
          - lightspeed_report_hosts | length > 0
        fail_msg: >-
          Attach the Lightspeed service account credential (INSIGHTS_CLIENT_ID /
          INSIGHTS_CLIENT_SECRET) and use the Lightspeed inventory.

    - name: Get a Lightspeed access token from the service account
      ansible.builtin.uri:
        url: "{{ lightspeed_report_sso_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          scope: api.console
          client_id: "{{ lightspeed_report_client_id }}"
          client_secret: "{{ lightspeed_report_client_secret }}"
        timeout: "{{ lightspeed_report_timeout }}"
      register: lightspeed_report_token
      no_log: true

    - name: Get each host's OS and last upload time
      ansible.builtin.uri:
        url: "{{ lightspeed_report_api }}/systems/{{ hostvars[item].insights_id }}"
        headers:
          Authorization: "Bearer {{ lightspeed_report_token.json.access_token }}"
        timeout: "{{ lightspeed_report_timeout }}"
        # 404 = Lightspeed knows the host but has no vulnerability data for it.
        status_code: [200, 404]
      loop: "{{ lightspeed_report_hosts }}"
      loop_control:
        label: "{{ item }}"
      register: lightspeed_report_systems
      retries: 3
      delay: 10
      until: lightspeed_report_systems is succeeded
      when: hostvars[item].insights_id is defined

    - name: Count CVEs per host by severity and exploit status
      ansible.builtin.uri:
        url: >-
          {{ lightspeed_report_api }}/systems/{{ hostvars[item.0].insights_id
          }}/cves?page_size=1&{{ item.1.query }}
        headers:
          Authorization: "Bearer {{ lightspeed_report_token.json.access_token }}"
        timeout: "{{ lightspeed_report_timeout }}"
        status_code: [200, 404]
      loop: "{{ lightspeed_report_hosts | product(lightspeed_report_buckets) | list }}"
      loop_control:
        label: "{{ item.0 }} {{ item.1.name }}"
      register: lightspeed_report_counts
      retries: 3
      delay: 10
      until: lightspeed_report_counts is succeeded
      when: hostvars[item.0].insights_id is defined

    - name: Build one report row per host
      ansible.builtin.set_fact:
        lightspeed_report_rows: "{{ lightspeed_report_rows | default([]) + [row] }}"
      loop: "{{ lightspeed_report_systems.results }}"
      loop_control:
        label: "{{ item.item }}"
      vars:
        found: "{{ item.status | default(0) == 200 }}"
        attrs: "{{ item.json.data.attributes | default({}) if found else {} }}"
        counts: >-
          {{ dict(lightspeed_report_counts.results
                  | selectattr('item.0', 'equalto', item.item)
                  | selectattr('status', 'defined')
                  | selectattr('status', 'equalto', 200)
                  | map(attribute='item.1.name')
                  | zip(lightspeed_report_counts.results
                        | selectattr('item.0', 'equalto', item.item)
                        | selectattr('status', 'defined')
                        | selectattr('status', 'equalto', 200)
                        | map(attribute='json.meta.total_items'))) }}
        row:
          host: "{{ item.item }}"
          found: "{{ found }}"
          os: "{{ attrs.os | default('unknown') }}"
          last_upload: "{{ (attrs.last_upload | default(''))[:10] }}"
          critical: "{{ counts.critical | default(0) | int }}"
          important: "{{ counts.important | default(0) | int }}"
          known_exploit: "{{ counts.known_exploit | default(0) | int }}"
          fixable: "{{ counts.fixable | default(0) | int }}"

    - name: Show each host in the job output
      ansible.builtin.debug:
        msg: >-
          {{ item.host }} ({{ item.os }}): {{ item.critical }} critical,
          {{ item.important }} important, {{ item.known_exploit }} known exploit,
          {{ item.fixable }} with a fix{{ '' if item.found else ' - no vulnerability data' }}
      loop: "{{ lightspeed_report_rows }}"
      loop_control:
        label: "{{ item.host }}"

    - name: Render the HTML report
      ansible.builtin.template:
        src: templates/lightspeed_report.html.j2
        dest: "{{ lightspeed_report_dest }}"
        mode: "0644"
      delegate_to: "{{ lightspeed_report_host }}"
      vars:
        lightspeed_report_generated: "{{ now(utc=true, fmt='%Y-%m-%d %H:%M UTC') }}"

    - name: Show where the report was saved
      ansible.builtin.debug:
        msg: "Report saved on {{ lightspeed_report_host }} at {{ lightspeed_report_dest }}"
